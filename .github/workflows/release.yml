name: Release

# Push a tag like v1.0.4 (after `npm version patch`) and this builds the desktop app on
# real Mac and Windows machines and publishes it to seinwinhtutAU/branchwise-release.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      # One at a time, so the two jobs don't both try to create the same GitHub release.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          if [ "v$(node -p "require('./package.json').version")" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version. Run npm version first."
            exit 1
          fi

      - run: npm ci

      - run: npm run build
        env:
          # Baked into the app at build time: configure VITE_API_BASE_URL in GitHub Secrets or Variables
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}

      - name: Build and publish
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          # A token with Contents: read/write on branchwise-release, saved as a repo secret.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
